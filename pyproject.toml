[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-autopilot"
version = "0.2.0"
description = "Find what people search for, make narrated videos and publish them every day to YouTube, Instagram and Facebook, across several channels, with a daily report and an optional dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
research = ["google-auth>=2.20"]
maker = ["kokoro-onnx==0.6.1", "soundfile>=0.12", "numpy>=1.26", "playwright>=1.40", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
